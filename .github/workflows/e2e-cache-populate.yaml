# Populates the public GHCR cache of e2e test app images that kind-e2e.yaml
# and version-skew.yaml read anonymously. Cache tags are content addressed
# (hash of the app sources), so runs are incremental: apps whose sources are
# unchanged are cache hits and are not rebuilt.
#
# Note: the ghcr.io/dapr/e2e-cache/* packages must be marked public (one-time,
# in the org package settings) so that pull requests, including from forks,
# can read them without credentials.
name: e2e-cache-populate

on:
  push:
    branches:
    - master
    - release-*
    paths:
    - "tests/apps/**"
    - "tests/dapr_tests.mk"
    - ".build-tools/**"
    - "Makefile"
    - ".github/workflows/e2e-cache-populate.yaml"
  schedule:
  - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions: {}

jobs:
  populate:
    name: populate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_PORT: 5000
      REGISTRY_NAME: local-registry
      DAPR_REGISTRY: localhost:5000/dapr
      DAPR_TAG: dev
      DAPR_CACHE_REGISTRY: "ghcr.io/dapr/e2e-cache"
    steps:
    - name: Check out code
      uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - name: Login to GitHub Container Registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Setup local registry
      # The build tool pushes each app to a destination registry as well as to
      # the cache; a throwaway local registry keeps that fast.
      run: |
        docker run -d --restart=always -p ${{ env.REGISTRY_PORT }}:5000 --name ${{ env.REGISTRY_NAME }} registry:2
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        df -h
    - name: Build and push test apps
      run: |
        make compile-build-tools
        make -j 6 build-push-e2e-app-all

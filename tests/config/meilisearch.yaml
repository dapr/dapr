apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dapr-meilisearch
  name: dapr-meilisearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dapr-meilisearch
  template:
    metadata:
      labels:
        app: dapr-meilisearch
    spec:
      containers:
        # Keep in step with the version components-contrib tests against.
        - image: getmeili/meilisearch:v1.43
          name: meilisearch
          env:
            - name: MEILI_MASTER_KEY
              value: e2e-master-key
            - name: MEILI_NO_ANALYTICS
              value: "true"
          ports:
            - containerPort: 7700
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/os
                  operator: In
                  values:
                    - linux
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
                    - arm64

---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: dapr-meilisearch
  name: dapr-meilisearch
spec:
  ports:
    - port: 7700
      protocol: TCP
      targetPort: 7700
  selector:
    app: dapr-meilisearch
  type: ClusterIP

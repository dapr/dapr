{{- if and (eq .Values.global.actors.enabled true) (eq .Values.global.actors.serviceName "placement") (ne (include "dapr.schedulerPlacementEnabled" .) "true") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dapr-placement
  namespace: {{ .Release.Namespace }}
  {{- with .Values.serviceAccount.placement.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- range $key, $value := .Values.global.k8sLabels }}
    {{ $key }}: {{ tpl $value $ }}
    {{- end }}
{{- end }}
{{- /*
No Role or ClusterRole for placement: it makes no Kubernetes API calls, so the
empty rules: [] one granted nothing and only took a cluster-wide name.
*/}}

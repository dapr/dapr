syntax = "proto3";

package dapr.proto.runtime.v1;

option csharp_namespace = "Dapr.Client.Autogen.Grpc.v1";
option java_outer_classname = "DaprProtos";
option java_package = "io.dapr.v1";
option go_package = "github.com/dapr/dapr/pkg/proto/runtime/v1;runtime";

import "dapr/proto/common/v1/common.proto";

// SetBinaryFileRequest is the request for SetBinaryFileAlpha1.
// The first message in the stream must contain the options; subsequent
// messages carry chunks of the binary file content via payload.
message SetBinaryFileRequest {
  // Request details. Must be present in the first message only.
  SetBinaryFileRequestOptions options = 1;
  // Chunk of data of arbitrary size.
  common.v1.StreamPayload payload = 2;
}

// SetBinaryFileRequestOptions contains options for the first message in the
// SetBinaryFileAlpha1 request.
message SetBinaryFileRequestOptions {
  // Name of the component. Required.
  string component_name = 1 [json_name="componentName"];
  // Name of the file to store. Required.
  string file_name = 2 [json_name="fileName"];
  // When false (POST semantics), the operation fails if a file with the same
  // name already exists. When true (PUT semantics), any existing file is
  // replaced. Defaults to false.
  bool overwrite = 3 [json_name="overwrite"];
}

// SetBinaryFileResponse is the response for SetBinaryFileAlpha1.
message SetBinaryFileResponse {}

// GetBinaryFileRequest is the request for GetBinaryFileAlpha1.
message GetBinaryFileRequest {
  // Name of the component. Required.
  string component_name = 1 [json_name="componentName"];
  // Name of the file to retrieve. Required.
  string file_name = 2 [json_name="fileName"];
}

// GetBinaryFileResponse is the streaming response for GetBinaryFileAlpha1.
message GetBinaryFileResponse {
  // Chunk of data.
  common.v1.StreamPayload payload = 1;
}

// DeleteBinaryFileRequest is the request for DeleteBinaryFileAlpha1.
message DeleteBinaryFileRequest {
  // Name of the component. Required.
  string component_name = 1 [json_name="componentName"];
  // Name of the file to delete. Required.
  string file_name = 2 [json_name="fileName"];
}

// DeleteBinaryFileResponse is the response for DeleteBinaryFileAlpha1.
message DeleteBinaryFileResponse {}
